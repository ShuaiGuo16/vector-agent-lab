[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-agent"
version = "0.1.0"
description = "Python orchestration for VECTOR Agent Lab's frozen maneuver interface"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "websockets>=14,<18", "python-dotenv>=1,<2"]

[tool.setuptools.package-data]
vector_agent = ["contract.json"]

[tool.setuptools.packages.find]
include = ["vector_agent*"]
